name: Verify development branch

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject tracked secrets and databases
        run: |
          unsafe=$(git ls-files | grep -Ei '(^|/)(\.env($|\.[^/]+)|\.secrets/|data/|logs/)|\.(sqlite|sqlite-wal|sqlite-shm|pem|key)$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$unsafe" ]; then
            echo 'Sensitive file path is tracked'
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -e '.[test,api]'
      - name: Run tests
        run: python -m pytest -q
      - name: Check Mini App API contract
        run: python scripts/export_mini_app_contract.py --check
      - name: Compile source
        run: python -m compileall -q src scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          package_json_file: mini_app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mini_app/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check generated API types
        run: node ../scripts/generate_mini_app_types.mjs --check
      - name: Test visitor client
        run: pnpm test
      - name: Build visitor client
        run: pnpm build
