server {
    listen 80;
    server_name meetcalendar.fin-partner.pro;

    root /var/www/meetcalendar.fin-partner.pro;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meetcalendar.fin-partner.pro;

    root /var/www/meetcalendar.fin-partner.pro;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/meetcalendar.fin-partner.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetcalendar.fin-partner.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
