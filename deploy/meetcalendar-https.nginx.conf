server {
    listen 80;
    server_name meetcalendar.fin-partner.pro;

    root /var/www/meetcalendar.fin-partner.pro;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meetcalendar.fin-partner.pro;

    root /var/www/meetcalendar.fin-partner.pro;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/meetcalendar.fin-partner.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetcalendar.fin-partner.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Mini App and API use the same versioned image. Upstream is loopback only.
    location = /app {
        return 302 /app/;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host meetcalendar.fin-partner.pro;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        access_log off;
    }

    location /api/v1/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host meetcalendar.fin-partner.pro;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
