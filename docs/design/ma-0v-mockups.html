  <div class="viz-controls ma-top-controls">
    <label class="form-label">Экран

        <option value="expired">Время удержания истекло</option><option value="attention">Заявка требует проверки</option><option value="policy-booking">Согласие для записи</option><option value="policy-access">Согласие для доступа</option>

    <section data-variant="Сияние" aria-label="Сияние"><div class="ma-stage"><div class="ma-phone" data-layout="glow" data-theme="dark" aria-label="Макет Сияние"></div></div></section>

  <script>
    (() => {
      const root = document.getElementById('meet-ma0v');
      const phones = [...root.querySelectorAll('.ma-phone')];
      const picker = root.querySelector('[data-preview-screen]');
      const state = { screen:'home', theme:'dark', width:'390', duration:null, platform:null, day:'Чт, 15 октября', time:null, template:'Знакомство и обсуждение задачи', name:'Анна', email:'anna@example.com', phone:'', purpose:'Обсудить план совместной работы', consent:false, tab:'pending', submitted:false, cancelled:false, approved:false, link:'', linked:false, google:'ok' };
      const design = { radius:20, glow:true };
      const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const button = (text, action, kind='', disabled=false) => `<button type="button" class="ma-button cursor-interaction ${kind}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
      const go = (text, target, kind='') => button(text, 'go:'+target, kind);
      const badge = (text, kind='') => `<span class="ma-badge ${kind}">${text}</span>`;
      const back = target => `<button type="button" class="ma-back cursor-interaction" data-action="go:${target}">‹ Назад</button>`;
      const progress = n => `<div class="ma-progress" aria-label="Шаг ${n} из 5">${Array.from({length:5},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('')}</div>`;
      const head = (n,title,sub,target) => `${back(target)}${progress(n)}<p class="ma-caption">Шаг ${n} из 5</p><h1>${title}</h1><p class="ma-muted">${sub}</p>`;
      const choice = (text,action,selected=false,disabled=false) => `<button type="button" class="ma-choice cursor-interaction" data-action="${action}" aria-pressed="${selected}" ${disabled?'disabled':''}>${text}</button>`;
      const field = (label,key,value,type='text') => `<label class="ma-field">${label}<input type="${type}" data-field="${key}" value="${esc(value)}" autocomplete="off"></label>`;
      const details = rows => `<dl class="ma-details">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
      const valid = () => !!state.name.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim()) && !!state.purpose.trim() && state.consent;
      function card(id,title,status,date,action,kind='') {
        return `<div class="ma-panel ma-stack"><div class="ma-row ma-between"><span class="ma-caption">Заявка №${id}</span>${badge(status,kind)}</div><h2>${title}</h2><p>${date}</p><p class="ma-caption">Москва · ${state.duration||30} минут · ${state.platform||'Яндекс Телемост'}</p>${go('Открыть заявку',action)}</div>`;
      }
      function screen() {
        switch(state.screen) {
          case 'home': return `<div class="ma-hero"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" aria-hidden="true" style="float:right;margin:0 0 8px 10px" viewBox="0 0 96 96"><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#244b73"/><stop offset="1" stop-color="#12233e"/></linearGradient><linearGradient id="ink" x2="1" y2="1"><stop stop-color="#c2eeff"/><stop offset="1" stop-color="#5bbcff"/></linearGradient></defs><rect x="9" y="9" width="78" height="78" rx="23" fill="url(#glass)" stroke="#5bbcff" stroke-opacity=".35"/><g transform="translate(22 21) scale(2.15)" fill="none" stroke="url(#ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="4"/><path d="M8 3v4m8-4v4M4 11h16m-12 5 3 3 5-5"/></g></svg><span class="ma-label">Онлайн-встречи</span><h1>Выберите время<br>для разговора</h1><p class="ma-muted">Запись на встречу - без долгой переписки.</p></div><div class="ma-stack">${go('Записаться на встречу →','template','primary')}${go('Мои заявки','bookings')}${go('Мои данные','profile','ghost')}</div><p class="ma-note">Вы выбираете время, администратор подтверждает встречу.</p><div class="ma-actions">${go('Управление встречами','admin','ghost')}</div>`;
          case 'template': return `${head(1,'О чём встреча?','Выберите подходящий формат.','home')}<div class="ma-stack">${choice('<strong>Знакомство и обсуждение задачи</strong><br><span class="ma-muted">Первая встреча и следующие шаги</span>','template:Знакомство и обсуждение задачи',state.template==='Знакомство и обсуждение задачи')}${choice('<strong>Рабочая консультация</strong><br><span class="ma-muted">Разбор конкретного вопроса</span>','template:Рабочая консультация',state.template==='Рабочая консультация')}</div><div class="ma-actions">${go('Далее','format','primary')}</div>`;
          case 'format': return `${head(2,'Длительность и связь','Сколько времени вам понадобится?','template')}<div class="ma-grid">${[15,30,45,60,90].map(n=>choice(n+' мин','duration:'+n,state.duration===n)).join('')}</div><h2>Где встретимся?</h2><div class="ma-grid two">${choice('Яндекс<br>Телемост','platform:Яндекс Телемост',state.platform==='Яндекс Телемост')}${choice('Zoom','platform:Zoom',state.platform==='Zoom',state.duration>30)}</div><p class="ma-caption">Для Zoom доступны встречи на 15 и 30 минут.</p><div class="ma-actions">${button('Далее','go:time','primary',!state.duration||!state.platform)}</div>`;
          case 'time': return `${head(3,'Удобное время','15-16 октября · время по Москве','format')}<div class="ma-grid two">${choice('Чт, 15 октября','day:Чт, 15 октября',state.day==='Чт, 15 октября')}${choice('Пт, 16 октября','day:Пт, 16 октября',state.day==='Пт, 16 октября')}</div><div class="ma-row ma-between"><h2>Начало встречи</h2><span class="ma-caption">МСК · UTC+3</span></div><div class="ma-grid">${['10:00','11:00','13:00','14:00','15:00','16:00'].map(t=>choice(t,'time:'+t,state.time===t)).join('')}</div><p class="ma-caption">Показаны только доступные варианты.</p><div class="ma-actions">${button('Выбрать время','go:contacts','primary',!state.time)}</div>`;
          case 'contacts': return `${head(4,'Контакты и цель','Используйте сохранённые данные или измените их.','time')}<div class="ma-row ma-between">${badge('Время удерживается · 09:42')}<span class="ma-caption">${state.time||'14:00'} МСК</span></div><div class="ma-panel ma-stack">${field('Как к вам обращаться','name',state.name)}${field('Email для приглашения','email',state.email,'email')}${field('Телефон · необязательно','phone',state.phone,'tel')}<p class="ma-caption">Telegram: @anna_demo · получен из профиля</p><label class="ma-field">Цель встречи<textarea data-field="purpose">${esc(state.purpose)}</textarea></label></div><label class="ma-check"><input type="checkbox" data-field="consent" ${state.consent?'checked':''}><span>Даю согласие на обработку данных для записи на встречу.</span></label>${button('Политика и текст согласия','policy','ghost')}<p class="ma-error" role="alert" data-validation ${state.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim())?'':'hidden'}>Проверьте email, например name@example.com.</p><div class="ma-actions">${button('Проверить заявку','go:review','primary',!valid())}${button('Сбросить выбор','reset','ghost')}</div>`;
          case 'review': return `${head(5,'Всё верно?','Проверьте заявку перед отправкой.','contacts')}<div class="ma-panel">${details([['Встреча',esc(state.template)],['Дата и время',esc(state.day)+' · '+esc(state.time||'14:00')+' МСК'],['Формат',(state.duration||30)+' минут · '+esc(state.platform||'Яндекс Телемост')],['Контакты',esc(state.name)+'<br>'+esc(state.email.trim())],['Цель',esc(state.purpose)]])}</div><p class="ma-note">Ответ - до 14 октября, 18:00 МСК.<br>Подтверждённую встречу можно отменить не позднее чем за час до начала.</p><div class="ma-actions">${button('Отправить заявку','submit','primary')}${button('Изменить данные','go:contacts','ghost')}</div>`;
          case 'success': return `<span class="ma-success" aria-hidden="true">✓</span><h1>Заявка отправлена</h1><p class="ma-muted">№1043 · ${esc(state.day)}, ${esc(state.time||'14:00')} МСК</p><div class="ma-panel ma-stack">${badge('Ожидает решения','warn')}<p>Время зарезервировано. Подтверждение придёт в чат после решения администратора.</p><p class="ma-caption">Ответ - до 14 октября, 18:00 МСК</p></div><div class="ma-actions">${go('Мои заявки','bookings','primary')}${go('На главную','home','ghost')}</div>`;
          case 'bookings': return `${back('home')}<h1>Мои заявки</h1><div class="ma-tabs">${[['pending','На рассмотрении'],['future','Предстоящие'],['history','История']].map(([key,label])=>`<button type="button" class="cursor-interaction" data-action="tab:${key}" aria-pressed="${state.tab===key}">${label}</button>`).join('')}</div>${state.tab==='pending'?go('Требует проверки · 1','attention'):''}${state.tab==='pending'?card('1043',state.template,state.linked?'Подтверждена':state.approved?'Ожидает ссылку':'Ожидает решения','15 октября · 14:00','details',state.linked?'ok':'warn'):state.tab==='future'?card('1042','Рабочая консультация','Подтверждена','13 октября · 16:00','details','ok'):card('1026','Знакомство','Завершена','6 октября · 11:00','details')}<div class="ma-actions">${go('Новая заявка','template','primary')}</div>`;
          case 'details': {
            const future=state.tab==='future',history=state.tab==='history';
            const confirmed=future||state.linked;
            const status=state.cancelled?'Отменена':history?'Завершена':confirmed?'Подтверждена':state.approved?'Ожидает ссылку':'Ожидает решения';
            const when=history?'6 октября · 11:00-11:30 МСК':future?'13 октября · 16:00-16:30 МСК':'15 октября · 14:00-14:30 МСК';
            return `${back('bookings')}<div class="ma-row ma-between"><span class="ma-caption">Заявка №${history?'1026':future?'1042':'1043'}</span>${badge(status,confirmed&&!state.cancelled?'ok':'warn')}</div><h1>${history?'Знакомство':future?'Рабочая консультация':esc(state.template)}</h1><div class="ma-panel">${details([['Когда',when],['Где','Яндекс Телемост'],['Email','anna@example.com'],['Цель',esc(state.purpose)]])}</div><p class="ma-note">${history?'Встреча завершена.':confirmed?'Отмена доступна не позднее чем за час до начала.':'Ответ - до 14 октября, 18:00 МСК.'}</p><div class="ma-actions">${state.cancelled||history?go('Записаться снова','template','primary'):confirmed?button('Подключиться к встрече','connect','primary'):''}${history||state.cancelled?'':button(confirmed?'Отменить встречу':'Отозвать заявку','cancel','danger')}</div>`;
          }
          case 'access': return `<span class="ma-label">Доступ к записи</span><h1>Давайте познакомимся</h1><p class="ma-muted">Чтобы увидеть время для встречи, запросите доступ у администратора.</p><div class="ma-panel ma-stack"><h2>Ваши данные под защитой</h2><p class="ma-muted">Для запроса нужны Telegram ID и username. Контакты встречи вы добавите позже.</p>${button('Политика обработки данных','policy','ghost')}</div><label class="ma-check"><input type="checkbox" data-field="consent" ${state.consent?'checked':''}><span>Даю согласие на обработку данных для запроса доступа.</span></label><div class="ma-actions">${button('Запросить доступ','access','primary',!state.consent)}</div>`;
          case 'admin': return `${back('home')}<span class="ma-label">Управление встречами</span><h1>Заявки на решение</h1><p class="ma-muted">Сначала те, у которых ближе срок ответа.</p>${card('1043',state.template,state.approved?'Ожидает ссылку':'Ожидает решения','15 октября · 14:00','admin-detail','warn')}<p class="ma-caption">Анна · @anna_demo<br>Ответить до 14 октября, 18:00 МСК</p><div class="ma-actions">${go('Запросы доступа · 1','access-admin')}${go('Настройки','settings','ghost')}</div>`;
          case 'admin-detail': return `${back('admin')}<span class="ma-caption">Заявка №1043 · Анна</span><h1>${state.linked?'Встреча подтверждена':state.approved?'Добавьте ссылку':'Решение по заявке'}</h1><div class="ma-panel">${details([['Когда','15 октября · 14:00-14:30 МСК'],['Платформа','Яндекс Телемост'],['Контакты','anna@example.com · @anna_demo'],['Цель',esc(state.purpose)]])}</div>${state.approved&&!state.linked?`<p class="ma-note">Создайте встречу в Телемосте и вставьте её HTTPS-ссылку. Подтверждение - после проверки Google.</p>${field('Ссылка Яндекс Телемоста','link',state.link,'url')}`:''}<div class="ma-actions">${state.linked?badge('Событие Google проверено','ok'):state.approved?button('Проверить и подтвердить','link','primary',!state.link.trim()):button('Согласовать заявку','approve','primary')}${state.approved?'':button('Отклонить заявку','reject','danger')}</div>`;
          case 'settings': return `${back('admin')}<h1>Настройки</h1><div class="ma-panel">${[['Доступ пользователей','access-admin'],['Опубликованное время','schedule'],['Часы рассмотрения','hours'],['Шаблоны встреч','templates'],['Google Календарь','google'],['Предупреждения','alerts'],['Сводка за 7 и 30 дней','stats']].map(([label,target])=>`<button type="button" class="ma-menu cursor-interaction" data-action="go:${target}"><span>${label}</span><span aria-hidden="true">›</span></button>`).join('')}</div>`;
          case 'schedule': return `${back('settings')}<h1>Опубликованное время</h1><p class="ma-muted">Ближайшие 7 суток · Москва</p><div class="ma-panel ma-stack"><h2>Четверг, 15 октября</h2><p>10:00-17:00</p>${badge('Опубликовано','ok')}${button('Закрыть интервал','close-interval','danger')}</div><div class="ma-panel ma-stack"><h2>Пятница, 16 октября</h2><p>11:00-16:00</p>${badge('Опубликовано','ok')}</div><div class="ma-actions">${button('Добавить интервал','add-interval','primary')}${button('Закрыть часть времени','block-time')}</div>`;
          case 'google': return `${back('settings')}<h1>Google Календарь</h1><div class="ma-panel ma-stack">${badge(state.google==='ok'?'Работает':'Нужно подключить заново',state.google==='ok'?'ok':'issue')}<p>${state.google==='ok'?'Доступ к календарю проверен.':'Не удалось подтвердить доступ к календарю.'}</p><p class="ma-caption">Последняя проверка: 10 октября, 12:40 МСК</p></div><p class="ma-note">Обновление доступа выполняется автоматически. Если потребуется ваше участие, уведомление придёт в Telegram.</p><div class="ma-actions">${button('Проверить подключение','check-google','primary')}${button('Показать состояние с ошибкой','google-error','ghost')}</div>`;
          case 'profile': return `${back('home')}<h1>Мои данные</h1><div class="ma-panel ma-stack">${field('Имя','name',state.name)}${field('Email','email',state.email,'email')}${field('Телефон · необязательно','phone',state.phone,'tel')}<p class="ma-caption">@anna_demo · профиль Telegram</p></div><div class="ma-actions">${button('Сохранить изменения','save-profile','primary')}${button('Удалить сохранённые контакты','delete-profile','danger')}${button('Отозвать согласие','withdraw','ghost')}</div>`;
          case 'access-admin': return `${back('settings')}<h1>Доступ пользователей</h1><div class="ma-panel ma-stack">${badge('Новый запрос','warn')}<h2>Анна · @anna_demo</h2><p class="ma-caption">Запрос от 10 октября, 12:00 МСК</p>${button('Разрешить запись','permit','primary')}${button('Отклонить','reject','ghost')}</div>${button('Заблокированные пользователи','blocked')}`;
          case 'hours': return `${back('settings')}<h1>Часы рассмотрения</h1><p class="ma-muted">В эти часы считаются 3 рабочих часа на решение.</p><div class="ma-panel">${details([['Понедельник - пятница','10:00-19:00 МСК'],['Суббота и воскресенье','Не рассматриваем заявки']])}</div><p class="ma-note">Эти часы не публикуют время для встреч. Доступность задаётся отдельно.</p>${button('Изменить часы','edit-hours','primary')}`;
          case 'templates': return `${back('settings')}<h1>Шаблоны встреч</h1><div class="ma-panel ma-stack"><h2>Знакомство и обсуждение задачи</h2><p class="ma-muted">Первая встреча и следующие шаги</p>${badge('Активен','ok')}${button('Редактировать','edit-template')}</div>${button('Создать шаблон','new-template','primary')}`;
          case 'alerts': return `${back('settings')}<h1>Предупреждения</h1><div class="ma-panel ma-stack">${badge('Требует проверки','issue')}<h2>Не завершена отмена №1038</h2><p class="ma-muted">Google временно недоступен. Время сохраняется занятым до проверки.</p>${go('Открыть заявку','admin-detail')}</div><div class="ma-panel ma-stack"><h2>Не доставлено уведомление</h2><p class="ma-muted">Повтор отправки выполняется автоматически.</p></div>`;
          case 'stats': return `${back('settings')}<h1>Сводка</h1>${badge('Последние 7 дней')}<div class="ma-panel">${details([['Заявки','8'],['Подтверждены','5'],['Отклонены / истекли','1 / 1'],['Отменены','1'],['Среднее время решения','42 минуты']])}</div><p class="ma-caption">Пример агрегатов без контактов.</p>`;
          case 'expired': return `${back('home')}${badge('Время больше не удерживается','warn')}<h1>Выберите время заново</h1><p class="ma-muted">10 минут на оформление истекли. Выбранное время может быть занято другим посетителем.</p><div class="ma-panel"><p>Контакты и цель сохранены в текущем просмотре. Доступность времени проверим повторно.</p></div><div class="ma-actions">${button('Выбрать другое время','expired-time','primary')}${go('На главную','home','ghost')}</div>`;
          case 'attention': return `${back('bookings')}${badge('Требует проверки','issue')}<h1>Отмена ещё не завершена</h1><div class="ma-panel ma-stack"><span class="ma-caption">Заявка №1038 · актуальная</span><p>13 октября · 11:00 МСК</p><p class="ma-muted">Не удалось подтвердить отмену в календаре. Время остаётся занятым до проверки администратором.</p></div><p class="ma-note">Подтверждение отмены придёт в Telegram. Эта заявка остаётся среди актуальных.</p><div class="ma-actions">${go('Мои заявки','bookings','primary')}</div>`;
          case 'policy-booking': return `${back('contacts')}<h1>Согласие для записи</h1><div class="ma-panel ma-stack"><p>Отдельное согласие на обработку персональных данных для записи на встречу.</p><p>Данные: Telegram ID и username, имя, email, необязательный телефон, цель, время и статус встречи.</p><p>Действия: получение, хранение, использование, передача email в Google Календарь для приглашения, удаление по сроку.</p><p>Сведения в собственной базе бота хранятся по срокам политики. Оператор и порядок отзыва указаны в политике.</p></div><p class="ma-caption">Текст из действующего бота. Ссылка политики будет доступна в рабочем приложении.</p><div class="ma-actions">${go('Вернуться к согласию','contacts','primary')}</div>`;
          case 'policy-access': return `${back('access')}<h1>Согласие для доступа</h1><div class="ma-panel ma-stack"><p>Для запроса доступа бот сохранит ваш Telegram ID и username, а затем данные заявки, если вы решите записаться.</p><p>Согласие на обработку данных даётся отдельным действием.</p></div><p class="ma-caption">Текст из действующего бота. Ссылка политики будет доступна в рабочем приложении.</p><div class="ma-actions">${go('Вернуться к согласию','access','primary')}</div>`;
          case 'confirm-cancel': return `${back('details')}<h1>Отменить заявку?</h1><p class="ma-muted">Действие освободит время после завершения отмены. Статус можно проверить в «Моих заявках».</p><div class="ma-actions">${go('Да, отменить','cancelled','danger')}${go('Оставить заявку','details','primary')}</div>`;
          case 'confirm-reset': return `${back('contacts')}<h1>Сбросить выбор времени?</h1><p class="ma-muted">Удержание будет освобождено. Контакты останутся в текущем просмотре.</p><div class="ma-actions">${go('Сбросить и выбрать заново','reset-done','danger')}${go('Продолжить оформление','contacts','primary')}</div>`;
          case 'notice': return `${back('home')}<h1>${esc(state.noticeTitle||'Действие показано')}</h1><div class="ma-panel"><p>${esc(state.notice||'В макете изменено только отображение. Реальных операций нет.')}</p></div><div class="ma-actions">${go('Продолжить просмотр',state.noticeBack||'home','primary')}</div>`;
          default:return '';
        }
      }
      function render() {
        picker.value=[...picker.options].some(o=>o.value===state.screen)?state.screen:'';
        phones.forEach(p=>{
          p.dataset.theme=state.theme;
          p.style.setProperty('--ma-width',state.width+'px');
          p.style.setProperty('--ma-radius',design.radius+'px');
          p.innerHTML=`<div class="ma-tg"><button type="button" class="ma-close cursor-interaction" data-action="go:home" aria-label="На главную">‹</button><div><b>Планирование встреч</b><small>Мини-приложение · макет</small></div><span class="ma-dots" aria-hidden="true">•••</span></div><main class="ma-body" aria-live="polite">${screen()}</main>`;
          const orbit=p.querySelector('.ma-orbit');if(orbit)orbit.hidden=!design.glow;
        });
      }
      function notice(title,text,backTo) {state.noticeTitle=title;state.notice=text;state.noticeBack=backTo;state.screen='notice';}
      root.addEventListener('click',e=>{
        const target=e.target.closest('[data-action]');if(!target||target.disabled)return;
        const action=target.dataset.action;
        if(action.startsWith('go:'))state.screen=action.slice(3);
        else if(action.startsWith('template:'))state.template=action.slice(9);
        else if(action.startsWith('duration:')){state.duration=Number(action.slice(9));if(state.duration>30&&state.platform==='Zoom')state.platform=null;}
        else if(action.startsWith('platform:'))state.platform=action.slice(9);
        else if(action.startsWith('day:')){state.day=action.slice(4);state.time=null;}
        else if(action.startsWith('time:'))state.time=action.slice(5);
        else if(action.startsWith('tab:'))state.tab=action.slice(4);
        else if(action==='submit'){state.submitted=true;state.screen='success';}
        else if(action==='approve')state.approved=true;
        else if(action==='link'){if(!/^https:\/\/telemost\.yandex\.ru\/[^\s]+$/.test(state.link.trim())){notice('Проверьте ссылку','Для этого примера нужна HTTPS-ссылка telemost.yandex.ru с путём встречи.','admin-detail');}else{state.linked=true;notice('Встреча подтверждена','Демонстрация успешного ответа Google. Реальное событие не создавалось.','admin');}}
        else if(action==='cancel')state.screen='confirm-cancel';
        else if(action==='reset')state.screen='confirm-reset';
        else if(action==='expired-time'){state.time=null;state.screen='time';}
        else if(action==='check-google'){state.google='ok';}
        else if(action==='google-error')state.google='error';
        else if(action==='policy')state.screen=state.screen==='access'?'policy-access':'policy-booking';
        else if(action==='access')notice('Запрос доступа отправлен','Ожидайте решения администратора. В демонстрации запрос никуда не отправляется.','home');
        else if(action==='connect')notice('Подключение к встрече','В рабочем приложении откроется ссылка выбранного видеосервиса. В макете внешней ссылки нет.','details');
        else notice('Предпросмотр действия','Положение и название действия показаны. Рабочая форма будет реализована на программном этапе; данные не сохраняются на сервере.',state.screen);
        if(state.screen==='cancelled'){state.cancelled=true;state.screen='details';}
        if(state.screen==='reset-done'){state.time=null;state.screen='time';}
        render();
      });
      function inputChanged(e){
        const key=e.target.dataset.field;if(!key)return;
        state[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;
        phones.forEach(p=>{p.querySelectorAll('[data-field]').forEach(el=>{if(el===e.target||el.dataset.field!==key)return;if(el.type==='checkbox')el.checked=state[key];else el.value=state[key];});const next=p.querySelector('[data-action="go:review"]');if(next)next.disabled=!valid();const access=p.querySelector('[data-action="access"]');if(access)access.disabled=!state.consent;const link=p.querySelector('[data-action="link"]');if(link)link.disabled=!state.link.trim();const error=p.querySelector('[data-validation]');if(error)error.hidden=!state.email.trim()||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim());});
      }
      root.addEventListener('input',inputChanged);
      root.addEventListener('change',inputChanged);
      picker.addEventListener('change',()=>{state.screen=picker.value;render();});
      const restore=s=>{const v=s?.modelContent;if(!v)return;if(['dark','light'].includes(v.theme))state.theme=v.theme;if(['320','360','390','430'].includes(v.width))state.width=v.width;if([...picker.options].some(o=>o.value===v.screen))state.screen=v.screen;};
      const remember=()=>{window.openai?.setWidgetState?.({modelContent:{screen:state.screen,theme:state.theme,width:state.width},privateContent:null})?.catch(()=>{});};
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',e=>{const before=[state.screen,state.theme,state.width].join('|');restore(e.detail?.globals?.widgetState);if(before!==[state.screen,state.theme,state.width].join('|'))render();});
      root.addEventListener('click',e=>{if(e.target.closest('[data-action]'))remember();});
      picker.addEventListener('change',remember);
      root.addEventListener('ma-preview-settings',e=>{restore({modelContent:e.detail});render();});
      render();
      if(globalThis.Tweak){
        const tweak=new Tweak({container:root,onChange:render});
        tweak.addSelect(state,'theme',{label:'Тема',options:[{label:'Тёмная',value:'dark'},{label:'Светлая',value:'light'}]});
        tweak.addSelect(state,'width',{label:'Ширина экрана',options:['320','360','390','430']});
        tweak.addSlider(design,'radius',{label:'Скругление карточек',min:12,max:24,unit:'px'});
        tweak.addToggle(design,'glow',{label:'Световой акцент на главной'});
      }
    })();
  </script>
</div>
