[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-meetings-bot"
version = "0.1.0"
description = "Telegram meeting scheduling bot"
requires-python = ">=3.12"
dependencies = ["tzdata>=2025.2,<2028", "google-auth-oauthlib>=1.2,<2", "aiogram>=3.31,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx==0.28.1"]
api = ["fastapi==0.143.0", "starlette==1.7.0", "pydantic==2.13.5", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_bot = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
